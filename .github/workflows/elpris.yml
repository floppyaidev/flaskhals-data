name: Uppdatera elpriser

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elpris
  cancel-in-progress: false

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta data från ENTSO-E
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python hamta_elpris.py

      - name: Spara ändringar
        run: |
          git config user.name "elpris-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Inga ändringar"
            exit 0
          fi
          git commit -m "Uppdatera elpriser"
          git pull --rebase --autostash origin main
          git push
